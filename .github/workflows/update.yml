# Runs every morning: downloads new/changed meetings from Legistar, rebuilds the
# statistics, emails agenda alerts, and publishes the site to GitHub Pages.
# You can also run it by hand: Actions tab > "Update council data" > Run workflow.
name: Update council data

on:
  schedule:
    - cron: "37 10 * * *"   # daily at 10:37 UTC = 5:37 am EST / 6:37 am EDT
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Re-download everything since July 2020 (takes 30-60 min)"
        type: boolean
        default: false
      summary_files:
        description: "AI summaries: only these file numbers, comma-separated (blank = the normal queue)"
        type: string
        default: ""
      docs_minutes:
        description: "Minutes to spend fetching the full text of legislation (the daily run uses 25)"
        type: number
        default: 25
  push:
    branches: [main]

permissions:
  contents: write   # only used to keep the schedule alive (see last step)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # The database is not stored in the repo (it would bloat it). Instead each
      # run starts from the copy the live site is serving and only adds changes.
      - name: Download the database the site is currently serving
        if: ${{ !inputs.full_rebuild }}
        run: |
          mkdir -p site/data
          if curl -fsSL -o site/data/council.db "${{ steps.pages.outputs.base_url }}/data/council.db"; then
            echo "Starting from the published database ($(du -h site/data/council.db | cut -f1))."
            cp site/data/council.db site/data/council.db.prev   # published alongside the new one
          else
            echo "No published database yet - doing the full first-time download."
            rm -f site/data/council.db
          fi

      # The full text of legislation lives in a separate database (docs.db), published
      # only in pieces. Rebuild it from those pieces so the backfill carries on.
      - name: Download the full-text database the site is currently serving
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          mkdir -p site/data
          if curl -fsSL --retry 3 -o /tmp/docs-info.json "$base/data/docs-info.json"; then
            n=$(python -c "import json; print(json.load(open('/tmp/docs-info.json'))['pieces'])")
            prefix=$(python -c "import json; print(json.load(open('/tmp/docs-info.json'))['urlPrefix'])")
            : > site/data/docs.db
            for i in $(seq 0 $((n - 1))); do
              curl -fsSL --retry 3 "$base/${prefix}$(printf %03d "$i")" >> site/data/docs.db
            done
            echo "Starting from the published full-text database ($(du -h site/data/docs.db | cut -f1))."
            cp site/data/docs.db site/data/docs.db.prev
          else
            echo "No full-text database yet - starting one."
          fi

      - name: Download the saved neighborhood map (or fetch it from OpenStreetMap)
        run: |
          curl -fsSL -o site/data/neighborhoods.geojson "${{ steps.pages.outputs.base_url }}/data/neighborhoods.geojson" || rm -f site/data/neighborhoods.geojson
          python scripts/fetch_neighborhoods.py

      - name: Collect meetings, agenda items and votes from Legistar
        run: python scripts/collect.py

      - name: Collect the full text of legislation
        env:
          DOCS_MINUTES: ${{ inputs.docs_minutes || (github.event_name == 'push' && 8) || 25 }}
        run: |
          pip install --quiet pypdf
          # OCR for scanned legislation (reads text off page images)
          sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
          python scripts/collect_docs.py

      # Plain-language summaries from Google's Gemini (free tier), each checked for accuracy.
      # Skipped if the GEMINI_API_KEY secret isn't set; a failure here never blocks the update.
      - name: Write AI summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_FILES: ${{ inputs.summary_files }}
          # Runs started by a code change only do a small batch, so site fixes go live quickly;
          # the daily run does the big batch.
          SUMMARY_MAX_REQUESTS: ${{ github.event_name == 'push' && '20' || '' }}
        run: python scripts/summarize.py || echo "::warning::The AI summaries step failed; the rest of the update continues."

      - name: Build statistics
        run: python scripts/build_stats.py

      - name: Build analysis
        run: python scripts/build_analysis.py

      - name: Build the "What's new" log
        run: python scripts/build_whatsnew.py

      - name: Data check
        run: python scripts/report.py

      - name: Send agenda alerts
        env:
          ALERT_WATCHLIST: ${{ secrets.ALERT_WATCHLIST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/alerts.py

      - name: Split the database into pieces for the website
        run: |
          python scripts/split_db.py --also site/data/council.db.prev
          python scripts/split_db.py --db site/data/docs.db --out docs --info docs-info.json --also site/data/docs.db.prev
          rm -f site/data/docs.db site/data/*.prev   # docs.db is published only in pieces

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # a commit. This adds an empty commit every ~50 quiet days so the daily
      # update keeps running. (Commits made here do not re-trigger this workflow.)
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
