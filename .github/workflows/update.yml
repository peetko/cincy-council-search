# The nightly data update: downloads new and changed meetings from Legistar, the full text of
# legislation, meeting transcripts and AI summaries, rebuilds the statistics, emails agenda alerts,
# saves the data, then asks "Publish site" (publish.yml) to put it on the website.
# Code changes don't run this; they only run "Publish site", which takes a few minutes.
# You can also run it by hand: Actions tab > "Update council data" > Run workflow.
name: Update council data

on:
  # Overnight, so the long work never holds up daytime fixes, and just after Gemini's free daily
  # allowance resets (midnight Pacific = 3 am Eastern). GitHub runs schedules "best effort": busy
  # times can delay or skip them, so there are two backups; each first checks whether today's
  # update already ran, and stops if it did.
  schedule:
    - cron: "37 8 * * *"    # 3:37 am EST / 4:37 am EDT
    - cron: "23 10 * * *"   # backup: 5:23 am EST / 6:23 am EDT
    - cron: "47 11 * * *"   # backup: 6:47 am EST / 7:47 am EDT
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Re-download everything since July 2020 (takes 30-60 min)"
        type: boolean
        default: false
      summary_files:
        description: "AI summaries: only these file numbers, comma-separated (blank = the normal queue)"
        type: string
        default: ""
      docs_minutes:
        description: "Minutes to spend fetching the full text of legislation (the daily run uses 25)"
        type: number
        default: 25
      transcript_minutes:
        description: "Minutes to spend fetching meeting transcripts (the daily run uses 30; use more to catch up faster)"
        type: number
        default: 30

permissions:
  actions: write    # see whether today's update already ran; start "Publish site" at the end
  contents: write   # only used to keep the schedule alive (see last step)

# One data update at a time. (Publishing has its own queue, so this never holds up a fix.)
concurrency:
  group: data-update
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  # A backup schedule only runs if no update has succeeded yet today (Eastern time).
  # Hand-started runs always go ahead.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d "$(TZ=America/New_York date +%F) 00:00 $(TZ=America/New_York date +%z)" +%Y-%m-%dT%H:%M:%SZ)
          done=0
          for ev in schedule workflow_dispatch; do   # a hand-started full update counts too
            n=$(gh run list -R "${{ github.repository }}" --workflow update.yml --event $ev --status success \
                --limit 20 --json createdAt -q "[.[] | select(.createdAt >= \"$since\")] | length")
            done=$((done + ${n:-0}))
          done
          if [ "$done" -gt 0 ]; then
            echo "Today's update already ran; this backup run stops here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No update yet today; running it now."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The databases aren't stored in the repo (they'd bloat it). Each update starts from the
      # data the last one saved, and only adds changes.
      - name: Get the latest data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/get_data.sh "${{ github.repository }}" "$SITE_URL"
          python scripts/fetch_data.py --assemble ${{ inputs.full_rebuild && '--fresh-council' || '' }}

      # The original caption files, kept between runs so changes to how they're processed can be
      # applied to every meeting without downloading them all again.
      - name: Restore saved caption files
        uses: actions/cache/restore@v4
        with:
          path: .cache/captions
          key: captions-${{ github.run_id }}
          restore-keys: captions-

      - name: Neighborhood map (saved copy, or fetched from OpenStreetMap)
        run: python scripts/fetch_neighborhoods.py

      - name: Collect meetings, agenda items and votes from Legistar
        run: python scripts/collect.py

      - name: Collect the full text of legislation
        env:
          DOCS_MINUTES: ${{ inputs.docs_minutes || 25 }}
        run: |
          pip install --quiet pypdf
          # OCR for scanned legislation (reads text off page images). Refresh the package list
          # first (Ubuntu removes old versions after security updates). If the install still
          # fails, carry on: scans that need OCR simply wait for the next run.
          sudo apt-get update -qq > /dev/null || true
          sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null \
            || echo "::warning::Couldn't install the OCR tools this run; scanned documents will be read on a later run."
          python scripts/collect_docs.py

      # What was said at meetings: the closed captions CitiCable posts to archive.org with each video.
      # Names of members of the public are removed. A failure here never blocks the update.
      - name: Collect meeting transcripts
        env:
          TRANSCRIPT_MINUTES: ${{ inputs.transcript_minutes || 30 }}
        run: |
          pip install --quiet gender-guesser || echo "::warning::Couldn't install the first-name list; fewer names will be found."
          if ! python scripts/collect_transcripts.py; then
            echo "::warning::The transcripts step failed; keeping the published transcripts as they were."
            if [ -f site/data/transcripts.db.prev ]; then cp site/data/transcripts.db.prev site/data/transcripts.db; else rm -f site/data/transcripts.db; fi
          fi

      - name: Save caption files for next time
        if: always() && hashFiles('.cache/captions/*') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/captions
          key: captions-${{ hashFiles('.cache/captions/*') }}

      # Plain-language summaries from Google's Gemini (free tier), each checked for accuracy.
      # Skipped if the GEMINI_API_KEY secret isn't set; a failure here never blocks the update.
      - name: Write AI summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_FILES: ${{ inputs.summary_files }}
        run: python scripts/summarize.py || echo "::warning::The AI summaries step failed; the rest of the update continues."

      - name: Build statistics
        run: python scripts/build_stats.py

      - name: Build analysis
        run: python scripts/build_analysis.py

      - name: Build the "What's new" log
        run: python scripts/build_whatsnew.py

      - name: Data check
        run: python scripts/report.py

      - name: Send agenda alerts
        env:
          ALERT_WATCHLIST: ${{ secrets.ALERT_WATCHLIST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SITE_URL: ${{ env.SITE_URL }}
        run: python scripts/alerts.py

      - name: Split the database into pieces for the website
        run: |
          python scripts/split_db.py --also site/data/council.db.prev
          python scripts/split_db.py --db site/data/docs.db --out docs --info docs-info.json --also site/data/docs.db.prev
          python scripts/split_db.py --db site/data/transcripts.db --out transcripts --info transcripts-info.json --also site/data/transcripts.db.prev
          rm -f site/data/docs.db site/data/transcripts.db site/data/*.prev   # published only in pieces

      # Safety net: if the page's files are broken, missing or cut off, stop here so the
      # broken data is never saved or published.
      - name: Check the site before saving
        run: python scripts/check_site.py

      # Save the data for "Publish site" (and for tomorrow's update to start from).
      - name: Save the data
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
          retention-days: 90
          compression-level: 1

      - name: Publish the site with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "${{ github.repository }}" --ref main

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # a commit. This adds an empty commit every ~50 quiet days so the daily
      # update keeps running. (Commits made here do not re-trigger any workflow.)
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
