name: Video caption probe
on:
  push:
    branches: [diag5]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tests/video_probe.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe && git commit -qm "[skip ci] probe samples" && git push origin HEAD:diag5-samples --force
