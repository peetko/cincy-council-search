name: Summary trial
on:
  push:
    branches: [diag2]
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Ollama (runs open AI models on this machine)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          nproc; free -g | head -2
      - name: Summarize 10 ordinances with three small models
        run: python3 tests/summary_trial.py llama3.2:3b qwen2.5:3b gemma3:4b
